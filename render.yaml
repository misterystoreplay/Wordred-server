# Render Blueprint para el servidor de WordRed
# ---------------------------------------------------------------
# Cómo usarlo:
# 1. Sube estos archivos sueltos a la raíz de un repositorio en GitHub.
# 2. En Render: New + -> Blueprint -> conecta el repositorio.
#    Render lee este archivo y crea el servicio solo.
# 3. Copia la URL del servicio (https://wordred-server.onrender.com).
#    Con WordRed 1.4 la app se conecta sola, sin configurar nada:
#    solo abre la app y sincroniza. No hay que poner la URL ni
#    vincular el teléfono a mano.
#
# Archivos PARA SIEMPRE con Cloudinary (v1.4, plan gratis, 25 GB):
# sin estas dos variables los archivos quedan solo en el disco del
# servicio, que en el plan gratis se pierde al reiniciar o al volver
# a desplegar. Los pasos para crear la cuenta y el preset sin firmar
# están en server/README.md ("Cloudinary (archivos para siempre)").
# Cuando las tengas, quita el # de las dos líneas y pon tus datos.
#
# Ojo (honesto): en el plan gratis de Render el disco es efímero:
# los datos (publicaciones, mensajes) se pierden al reiniciar o al
# volver a desplegar. Para guardarlos de verdad hace falta un disco
# persistente (plan de pago) o una base de datos externa. Los
# ARCHIVOS, con Cloudinary configurado, quedan para siempre.

services:
  - type: web
    name: wordred-server
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Datos PARA SIEMPRE con MongoDB Atlas (v3.1, plan gratis M0,
      # 512 MB, sin tarjeta): sin esta variable, los datos quedan en
      # archivos JSON en el disco del servicio, que en el plan gratis
      # se pierde al reiniciar o al volver a desplegar (las
      # publicaciones se borran y no aparecen en otro dispositivo).
      # La cadena se crea en MongoDB Atlas (cuenta gratis con Google,
      # cluster M0, usuario de base de datos y acceso de red
      # 0.0.0.0/0) y va aquí como secreto, nunca en el código ni en la
      # APK. Pasos en Despliegue-servidor-WordRed.md, Paso 5r.
      # - key: MONGODB_URI
      #   sync: false
      # Archivos para siempre con Cloudinary (v1.4): quita el # y pon
      # tus datos cuando crees la cuenta y el preset sin firmar
      # (ver server/README.md). Sin estas dos variables, los archivos
      # quedan solo en el disco efímero del plan gratis.
      # - key: CLOUDINARY_CLOUD_NAME
      #   sync: false
      # - key: CLOUDINARY_UPLOAD_PRESET
      #   sync: false
      # Borrar también en Cloudinary (opcional, secretos: nunca en la APK).
      # - key: CLOUDINARY_API_KEY
      #   sync: false
      # - key: CLOUDINARY_API_SECRET
      #   sync: false
      # SMS reales con Twilio (opcional): sin estas tres variables el
      # servidor muestra el código en su registro ([DEV]) y la app lo
      # muestra en la pantalla de vinculación en modo de prueba.
      # - key: TWILIO_SID
      #   sync: false
      # - key: TWILIO_TOKEN
      #   sync: false
      # - key: TWILIO_FROM
      #   sync: false
