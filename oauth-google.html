<!doctype html>
<!-- WordRed — Entrar con Google en el navegador (como en YouTube).
     La app abre esta página; Google muestra su propia pantalla para poner
     el correo y la contraseña, y devuelve el token de ID (GIS) a la
     página, que vuelve a la app con wordred://oauth/google. La contraseña
     solo se escribe en la página de Google: WordRed nunca la ve.
     El ID de cliente lo pone el servidor (__GOOGLE_CLIENT_ID__); en
     Google Cloud, el origen de esta página debe estar en "Orígenes de
     JavaScript autorizados" del cliente web de WordRed. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar con Google — WordRed</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#14060a;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .card{max-width:380px;width:100%;background:#241014;border:1px solid #4a1f28;border-radius:20px;padding:28px 22px;text-align:center}
  .logo{font-size:44px;font-weight:900;color:#e60026;letter-spacing:-1px}
  h1{font-size:20px;margin:6px 0 4px}
  p{font-size:14px;color:#d8b9be;line-height:1.5}
  .btn{display:inline-block;margin-top:14px;background:#e60026;color:#fff;border:none;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:700;text-decoration:none}
  .muted{font-size:12px;color:#9a7a81}
  #gbtn{margin:18px auto 0;display:flex;justify-content:center;min-height:40px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">W</div>
  <h1>Entrar con Google</h1>
  <p>Entra con tu cuenta de Google, como en YouTube. Tu correo y tu contraseña solo se escriben en la página de Google: WordRed nunca los ve.</p>
  <div id="g_id_onload" data-client_id="__GOOGLE_CLIENT_ID__" data-callback="onGoogleSignIn" data-auto_prompt="true" data-auto_select="false"></div>
  <div id="gbtn"><div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="continue_with" data-shape="pill" data-logo_alignment="left"></div></div>
  <p id="msg" class="muted">Abriendo el inicio de sesión de Google…</p>
  <a id="back" class="btn" href="#" style="display:none">Volver a WordRed</a>
</div>
<script>
  var done = false;
  function goBack(idToken) {
    if (done) return; done = true;
    var url = 'wordred://oauth/google?id_token=' + encodeURIComponent(idToken);
    var back = document.getElementById('back');
    back.href = url; back.style.display = 'inline-block';
    document.getElementById('msg').textContent = 'Sesión iniciada. Volviendo a WordRed…';
    window.location.href = url;
    setTimeout(function () { window.location.href = url; }, 900);
  }
  function onGoogleSignIn(r) {
    if (r && r.credential) goBack(r.credential);
    else document.getElementById('msg').textContent = 'No se pudo iniciar sesión con Google. Cierra esta pestaña y vuelve a intentarlo.';
  }
  window.addEventListener('load', function () {
    var cid = document.getElementById('g_id_onload').getAttribute('data-client_id') || '';
    if (!cid) {
      document.getElementById('msg').textContent = 'El inicio con Google aún no está configurado. Cierra esta pestaña y vuelve a intentarlo más tarde.';
      return;
    }
    setTimeout(function () {
      if (!window.google || !google.accounts) {
        document.getElementById('msg').textContent = 'No se pudo cargar el inicio de sesión de Google. Revisa tu conexión, cierra esta pestaña y vuelve a intentarlo.';
      }
    }, 8000);
  });
</script>
</body>
</html>
